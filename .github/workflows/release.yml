name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList clean

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create patches release token
        id: patches-release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: xob0t
          repositories: morphe-patches

      - name: Release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.patches-release-token.outputs.token }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Create autobuild dispatch token
        if: github.ref == 'refs/heads/main' && steps.release.outputs.new_release_published == 'true'
        id: autobuild-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: xob0t
          repositories: morphe-autobuilds

      - name: Trigger authoritative stable rebuild
        if: github.ref == 'refs/heads/main' && steps.release.outputs.new_release_published == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOBUILD_TOKEN: ${{ steps.autobuild-token.outputs.token }}
          PATCH_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          QUALIFICATION=null
          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.head.ref | startswith("autobuild/target-"))][0] // empty')
          if [ -n "$PR_JSON" ]; then
            PR_BODY=$(jq -r '.body // ""' <<<"$PR_JSON")
            PR_BODY="$PR_BODY" python3 .github/scripts/extract_qualification_evidence.py \
              --output "$RUNNER_TEMP/qualification-evidence.json"
            gh attestation verify "$RUNNER_TEMP/qualification-evidence.json" \
              --repo xob0t/morphe-autobuilds
            QUALIFICATION=$(jq -c '{
              app,
              package,
              version_name,
              version_code,
              source,
              source_index,
              source_fingerprint,
              apk_sha256,
              qualified_at,
              run_url
            }' "$RUNNER_TEMP/qualification-evidence.json")
          fi
          jq -n \
            --arg event patches-released \
            --arg patchTag "$PATCH_TAG" \
            --arg sourceRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson qualification "$QUALIFICATION" \
            '{
              event_type: $event,
              client_payload: {
                patch_tag: $patchTag,
                source_run: $sourceRun,
                qualification: $qualification
              }
            }' >"$RUNNER_TEMP/autobuild-dispatch.json"
          GH_TOKEN="$AUTOBUILD_TOKEN" gh api --method POST \
            repos/xob0t/morphe-autobuilds/dispatches \
            --input "$RUNNER_TEMP/autobuild-dispatch.json"

      - name: Report stable release automation failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Stable release automation failed"
          BODY="Stable release or its authoritative autobuild dispatch failed in $RUN_URL. If the release was already published, the daily autobuild schedule remains a reconciliation fallback."
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Still failing as of $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Keep only the newest dev prerelease. After a new one is published, delete
      # every older `*-dev.*` prerelease (its assets and git tag included) so they
      # don't accumulate. Stable (main) releases are never touched: this runs only
      # on dev, and the filter requires both isPrerelease and a `-dev.` tag.
      - name: Prune old dev prereleases
        if: github.ref == 'refs/heads/dev' && steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          if [ -z "$KEEP_TAG" ]; then
            echo "No new release tag to keep; skipping prune."
            exit 0
          fi
          echo "Keeping $KEEP_TAG; pruning older dev prereleases."
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | contains("-dev."))) | .tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              if [ "$tag" != "$KEEP_TAG" ]; then
                echo "Deleting old dev prerelease $tag"
                gh release delete "$tag" --yes --cleanup-tag
              fi
            done
